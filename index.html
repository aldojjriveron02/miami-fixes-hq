<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Miami Fixes HQ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fixes HQ">
<meta name="theme-color" content="#0b3d66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div id="brand">🔧 Miami Fixes HQ</div>
  <div id="today-line"></div>
</header>

<main id="screen"></main>

<nav id="tabs">
  <button data-tab="today" class="active">📋<span>Today</span></button>
  <button data-tab="jobs">🛠️<span>Jobs</span></button>
  <button data-tab="quotes">🧾<span>Quotes</span></button>
  <button data-tab="customers">👥<span>Customers</span></button>
</nav>

<div id="sheet-backdrop" class="hidden"></div>
<div id="sheet" class="hidden"><div id="sheet-body"></div></div>
<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
